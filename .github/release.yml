# GitHub 生成「发布说明」时的分类规则。
#
# 【先说清楚它不是干什么的】创建 Release 的不是这个文件——是
# `.github/workflows/build.yml` 里那个 `release` 作业调用的
# `softprops/action-gh-release`。这个文件只决定 `generate_release_notes: true`
# 生成出来的那段文字**怎么分组**。没有它照样能发 Release，只是所有 PR 会平铺成一列。
#
# 【分类依据是 PR 的标签，不是提交信息的前缀】所以：
#   - **每个 PR 得打上标签**，不然它会落进最后那条 `'*'` 兜底类；
#   - 下面用的 `enhancement` / `bug` / `documentation` 是 **GitHub 自带的默认标签**，
#     仓库里本来就有，不需要新建。刻意不去自造 `feat`/`fix` 那套——为了对齐提交信息的
#     前缀而新建一批标签，收益不抵多一套要维护的东西。
#
# 【兜底那条必须在最后】GitHub 按顺序匹配，把 `'*'` 放前面会把后面几类全吃掉。

changelog:
  exclude:
    # 想让某个 PR 不进发布说明（纯内部改动、依赖升级），给它打上这个标签即可。
    # **这个标签还没建**，要用先跑：gh label create skip-changelog
    # 建之前这一条是空转，不影响其它分类。
    labels:
      - skip-changelog
  categories:
    - title: 新功能
      labels:
        - enhancement
    - title: 修复
      labels:
        - bug
    - title: 文档
      labels:
        - documentation
    - title: 其它改动
      labels:
        - '*'
