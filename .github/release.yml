# ⚠️ **本文件当前不生效。** release 的正文由 `scripts/release-notes.sh` 生成，
# 已经不用 `generate_release_notes` 了（见 build.yml 的 release 作业）。
# 留着它是为了「万一改回自动生成」时有东西可用 —— **分类映射现在住在脚本里**，
# 改分类要去改脚本，不要只改这儿。
# GitHub 生成「发布说明」时的分类规则。
#
# 【先说清楚它不是干什么的】创建 Release 的不是这个文件——是
# `.github/workflows/build.yml` 里那个 `release` 作业调用的
# `softprops/action-gh-release`。这个文件只决定 `generate_release_notes: true`
# 生成出来的那段文字**怎么分组**。没有它照样能发 Release，只是所有 PR 会平铺成一列。
#
# 【分类依据是 PR 的标签，不是提交信息的前缀】这是 GitHub 的功能限制，绕不过去。
# 所以**每个 PR 都得打上标签**，不然它会落进最后那条 `'*'` 兜底类。
#
# 【标签名为什么用 feat/fix/docs 这套短的】本仓库的提交信息本来就是
# Conventional Commits（`feat(ribbon): …` / `fix(ci): …` / `docs: …`），标签名与提交
# 前缀一一对应之后，打标签就是照着提交开头抄一下，不用再记第二套词汇。
# GitHub 自带的 `enhancement`/`bug`/`documentation` 也能用，但那样等于为了迁就工具
# 再记一套同义词。
#
# 这几个标签**已经建好了**（`gh label list` 可查）。缺了的话配置不报错，只是空转。
#
# 【兜底那条必须在最后】GitHub 按顺序匹配，把 `'*'` 放前面会把后面几类全吃掉。

changelog:
  exclude:
    # 想让某个 PR 不进发布说明（纯内部改动、依赖升级这类对用户没意义的），
    # 给它打上这个标签即可。
    labels:
      - skip-changelog
  categories:
    - title: 新功能
      labels:
        - feat
    - title: 修复
      labels:
        - fix
    - title: 文档
      labels:
        - docs
    - title: 内部改动
      labels:
        # 对用户不可见，但值得留个记录，免得看发布说明时以为漏了什么
        - chore
        - style
        - refactor
    - title: 其它改动
      labels:
        - '*'
