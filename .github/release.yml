# GitHub 生成「发布说明」时的分类规则。
#
# 【先说清楚它不是干什么的】创建 Release 的不是这个文件——是
# `.github/workflows/build.yml` 里那个 `release` 作业调用的
# `softprops/action-gh-release`。这个文件只决定 `generate_release_notes: true`
# 生成出来的那段文字**怎么分组**。没有它照样能发 Release，只是所有 PR 会平铺成一列。
#
# 【分类依据是 PR 的标签，不是提交信息的前缀】所以：
#   - 打标签之前，这份配置**等于没生效**，所有 PR 会全部落进最后那条 `'*'` 兜底类；
#   - `feat` / `fix` / `docs` / `chore` / `ci` / `skip-changelog` 这几个标签
#     得先在仓库里**建出来**（Settings → Labels，或 `gh label create`），
#     否则给 PR 打不上。
#
# 【兜底那条必须在最后】GitHub 按顺序匹配，把 `'*'` 放前面会把后面几类全吃掉。

changelog:
  exclude:
    # 带这些标签的 PR 不进发布说明（内部改动、依赖升级这类对用户没意义的）
    labels:
      - skip-changelog
  categories:
    - title: 新功能
      labels:
        - feat
    - title: 修复
      labels:
        - fix
    - title: 文档
      labels:
        - docs
    - title: 构建与工具
      labels:
        - chore
        - ci
    - title: 其它改动
      labels:
        - '*'
